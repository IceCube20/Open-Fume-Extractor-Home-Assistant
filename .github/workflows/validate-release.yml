name: Validate and release integration

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('custom_components/open_fume_extractor/manifest.json'))['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and manifest version differ'
          PY
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/build_package.py
      - uses: softprops/action-gh-release@v2
        with:
          name: Open Fume Extractor HA ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/open-fume-extractor-ha-*.zip
