name: Validate and release integration

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('custom_components/open_fume_extractor/manifest.json'))['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and manifest version differ'
          PY
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright @mdi/js@7.4.47
      - run: npx playwright install --with-deps chromium
      - run: node tools/test_cards.cjs
        env:
          OFE_MDI_MODULE: node_modules/@mdi/js/mdi.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cards-preview
          path: tests/artifacts/cards
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests, hacs, cards]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare release title
        id: metadata
        run: |
          python - <<'PY'
          import json, os, re
          version = json.load(open('custom_components/open_fume_extractor/manifest.json'))['version']
          title = re.sub(r'rc\d+$', 'RC', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'title={title}\n')
          PY
      - run: python tools/build_package.py
      - uses: softprops/action-gh-release@v2
        with:
          name: Open Fume Extractor HA ${{ steps.metadata.outputs.title }}
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/open-fume-extractor-ha-*.zip
